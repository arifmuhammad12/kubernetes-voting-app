name: Voting App CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  REGISTRY: registry.adinusa.id
  REGISTRY_PROJECT: project-kubernetes-bootcamp
  REGISTRY_REPOSITORY: rif07

  VOTE_IMAGE: registry.adinusa.id/project-kubernetes-bootcamp/rif07/votes
  WORKER_IMAGE: registry.adinusa.id/project-kubernetes-bootcamp/rif07/worker
  RESULT_IMAGE: registry.adinusa.id/project-kubernetes-bootcamp/rif07/results

  NAMESPACE: challenge-adinusa

jobs:

  # ==========================================
  # CI - BUILD & PUSH DOCKER IMAGES
  # ==========================================
  build:
    name: Build & Push Images
    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Harbor
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build Vote
        run: |
          docker build \
            -t $VOTE_IMAGE:${GITHUB_SHA} \
            -t $VOTE_IMAGE:latest \
            ./votes

      - name: Build Worker
        run: |
          docker build \
            -t $WORKER_IMAGE:${GITHUB_SHA} \
            -t $WORKER_IMAGE:latest \
            ./worker

      - name: Build Result
        run: |
          docker build \
            -t $RESULT_IMAGE:${GITHUB_SHA} \
            -t $RESULT_IMAGE:latest \
            ./results

      - name: Push Vote
        if: github.event_name != 'pull_request'
        run: |
          docker push $VOTE_IMAGE:${GITHUB_SHA}
          docker push $VOTE_IMAGE:latest

      - name: Push Worker
        if: github.event_name != 'pull_request'
        run: |
          docker push $WORKER_IMAGE:${GITHUB_SHA}
          docker push $WORKER_IMAGE:latest

      - name: Push Result
        if: github.event_name != 'pull_request'
        run: |
          docker push $RESULT_IMAGE:${GITHUB_SHA}
          docker push $RESULT_IMAGE:latest


  # ==========================================
  # CD - DEPLOY TO K3S
  # ==========================================
  deploy:
    name: Deploy to K3s
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Kubernetes
        run: |
          kubectl version --client
          kubectl get nodes

      - name: Apply Namespace
        run: |
          kubectl apply -f Kubernetes/namespace.yaml

      - name: Apply Database Secret
        run: |
          kubectl apply \
            -f Kubernetes/database-secret.yaml \
            -n $NAMESPACE

      - name: Deploy PostgreSQL
        run: |
          kubectl apply \
            -f tools/postgresql.yaml \
            -n $NAMESPACE

      - name: Deploy Kafka
        run: |
          kubectl apply \
            -f tools/kafka.yaml \
            -n $NAMESPACE

      - name: Deploy Vote
        run: |
          kubectl apply \
            -f Kubernetes/vote.yaml \
            -n $NAMESPACE

      - name: Deploy Worker
        run: |
          kubectl apply \
            -f Kubernetes/worker.yaml \
            -n $NAMESPACE

      - name: Deploy Result
        run: |
          kubectl apply \
            -f Kubernetes/result.yaml \
            -n $NAMESPACE

      - name: Deploy Ingress
        run: |
          kubectl apply \
            -f Kubernetes/ingress.yaml \
            -n $NAMESPACE


      # ==========================================
      # UPDATE IMAGE TO CURRENT COMMIT
      # ==========================================

      - name: Update Vote Image
        run: |
          kubectl set image \
            deployment/rif07-votes \
            votes=$VOTE_IMAGE:${GITHUB_SHA} \
            -n $NAMESPACE

      - name: Update Worker Image
        run: |
          kubectl set image \
            deployment/rif07-worker \
            worker=$WORKER_IMAGE:${GITHUB_SHA} \
            -n $NAMESPACE

      - name: Update Result Image
        run: |
          kubectl set image \
            deployment/rif07-results \
            results=$RESULT_IMAGE:${GITHUB_SHA} \
            -n $NAMESPACE


      # ==========================================
      # ROLLOUT
      # ==========================================

      - name: Rollout Vote
        run: |
          kubectl rollout status \
            deployment/rif07-votes \
            -n $NAMESPACE \
            --timeout=180s

      - name: Rollout Worker
        run: |
          kubectl rollout status \
            deployment/rif07-worker \
            -n $NAMESPACE \
            --timeout=180s

      - name: Rollout Result
        run: |
          kubectl rollout status \
            deployment/rif07-results \
            -n $NAMESPACE \
            --timeout=180s


      # ==========================================
      # VERIFY
      # ==========================================

      - name: Verify Deployment
        run: |
          echo "===== PODS ====="
          kubectl get pods -n $NAMESPACE

          echo "===== SERVICES ====="
          kubectl get svc -n $NAMESPACE

          echo "===== DEPLOYMENTS ====="
          kubectl get deployment -n $NAMESPACE

          echo "===== INGRESS ====="
          kubectl get ingress -n $NAMESPACE